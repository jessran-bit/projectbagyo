<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Bagyo - Team Mission</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--navy-mid);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .team-id-badge { display: flex; align-items: center; gap: 10px; }
    .team-letter-sm {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(0,180,168,0.2);
      border: 1px solid rgba(0,180,168,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 900; color: var(--teal);
    }
    .round-section { display: none; }
    .round-section.active { display: block; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .score-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3);
      padding: 4px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700; color: var(--amber);
    }

    /* ---- MINI LESSON CARD ---- */
    .lesson-card {
      background: linear-gradient(135deg, rgba(0,180,168,0.12), rgba(124,58,237,0.08));
      border: 1px solid rgba(0,180,168,0.35);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .lesson-eyebrow {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 8px;
    }
    .lesson-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--white);
      margin-bottom: 12px;
    }
    .lesson-body {
      font-size: 0.88rem;
      color: var(--gray-200);
      line-height: 1.75;
      margin-bottom: 16px;
    }
    .lesson-body strong { color: var(--white); }
    .lesson-example {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid var(--amber);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: var(--gray-200);
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .lesson-example .ex-label {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--amber);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .lesson-keypoints {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .kp {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 0.84rem;
      color: var(--gray-200);
    }
    .kp-icon { color: var(--teal); flex-shrink: 0; margin-top: 2px; }
